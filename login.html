<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal Login — JEE CBT & AI Mentorship Platform</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-accent: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            padding: 32px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Role Switcher Tabs */
        .role-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #0f172a;
            padding: 6px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .role-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .role-tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
        }

        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        /* Preset Quick Login Buttons (For Seamless Testing) */
        .preset-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .preset-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-align: center;
        }

        .preset-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #e2e8f0;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s;
        }

        .preset-btn:hover {
            border-color: #3b82f6;
            background: #1e293b;
        }

        .preset-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .tag-inst { background: rgba(37, 99, 235, 0.2); color: #60a5fa; }
        .tag-super { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .tag-student { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .login-card {
                padding: 24px 18px;
                border-radius: 12px;
            }
            .brand-logo-badge {
                font-size: 15px;
                padding: 6px 14px;
            }
            #portalHeading {
                font-size: 17px !important;
            }
            .form-group input {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo-badge" id="portalBadge">JEE CBT ENTERPRISE</div>
            <h1 style="font-size: 20px; font-weight: 800;" id="portalHeading">Secure Institutional Gateway</h1>
            <div class="brand-subtitle" id="portalSubtitle">Private Isolated Database & Role-Based Access Control</div>
        </div>

        <!-- Role Tabs: Strictly Admin and Student -->
        <div class="role-tabs" id="roleTabsContainer" style="grid-template-columns: repeat(2, 1fr);">
            <button class="role-tab-btn active" id="tabInst" onclick="switchRoleTab('INST')">🏢 Admin</button>
            <button class="role-tab-btn" id="tabStudent" onclick="switchRoleTab('STUDENT')">🎓 Student</button>
        </div>

        <!-- Form Container -->
        <form id="loginForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group" id="instCodeGroup" style="display: none;">
                <label id="instCodeLabel">Institute Code (Optional)</label>
                <input type="text" id="instCodeInput" placeholder="e.g. APEX or CHANAKYA" style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label id="idLabel">Admin Email / ID</label>
                <input type="text" id="usernameInput" value="director@apexpatna.in" placeholder="e.g. director@yourinstitute.in" required>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin-bottom: 0;">Password / Access Key</label>
                    <button type="button" onclick="togglePasswordVisibility('passwordInput', 'eyeLoginBtn')" style="background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0;">
                        <span id="eyeLoginBtn">👁️ Show</span>
                    </button>
                </div>
                <div style="position: relative;">
                    <input type="password" id="passwordInput" value="••••••••" required style="padding-right: 42px;">
                    <button type="button" onclick="togglePasswordVisibility('passwordInput', 'eyeLoginBtn')" title="Show/Hide Password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 4px; line-height: 1;">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Sign In to Admin Portal →
            </button>
        </form>

        <!-- Institutional Security Guarantee (Zero Competitor Clutter) -->
        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--text-muted);">
                <span>🔒 256-bit SSL</span>
                <span>•</span>
                <span>Zero Cross-Tenant Leakage</span>
                <span>•</span>
                <span>NTA CBT Engine</span>
            </div>
            <div style="font-size: 11px; color: #64748b; margin-top: 6px;">
                Enter your institutional credentials to connect to your private isolated database.
            </div>
        </div>
    </div>

    <!-- Script Authentication Handlers -->
    <script type="module">
        import { setAuthSession, PRESET_ACCOUNTS, USER_ROLES } from './auth/session-auth-guard.js';

        let activeTab = 'INST';
        const urlParams = new URLSearchParams(window.location.search);
        const orgParam = (urlParams.get('org') || urlParams.get('tenant') || '').toLowerCase();

        // Automatic White-Label Tenant Branding if specified via URL
        if (orgParam === 'apex') {
            document.getElementById('portalBadge').textContent = 'APEX ACADEMY';
            document.getElementById('portalHeading').textContent = 'Apex IIT-JEE Academy, Patna';
            document.getElementById('portalSubtitle').textContent = 'Institutional Examination & Evaluation Gateway';
            document.getElementById('usernameInput').value = 'director@apexpatna.in';
        } else if (orgParam === 'chanakya') {
            document.getElementById('portalBadge').textContent = 'CHANAKYA KOTA';
            document.getElementById('portalHeading').textContent = 'Chanakya Science Institute, Kota';
            document.getElementById('portalSubtitle').textContent = 'Private CBT Examination Administration';
            document.getElementById('usernameInput').value = 'admin@chanakyakota.in';
        }

        // 1-Click God-Mode Instant Login for RannVijay
        const keyParam = urlParams.get('key') || urlParams.get('auth') || urlParams.get('master');
        if (keyParam === 'godmode' || keyParam === 'rannvijay' || keyParam === '1') {
            quickLogin('rannvijay@platform.com');
        }

        window.togglePasswordVisibility = function(inputId, btnTextId) {
            const input = document.getElementById(inputId);
            const btnText = document.getElementById(btnTextId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                if (btnText) btnText.textContent = '🙈 Hide';
            } else {
                input.type = 'password';
                if (btnText) btnText.textContent = '👁️ Show';
            }
        };

        window.switchRoleTab = function(tab) {
            activeTab = tab;
            document.querySelectorAll('.role-tab-btn').forEach(btn => btn.classList.remove('active'));

            const idLabel = document.getElementById('idLabel');
            const submitBtn = document.getElementById('submitBtn');
            const userInput = document.getElementById('usernameInput');

            if (tab === 'INST') {
                document.getElementById('tabInst').classList.add('active');
                idLabel.textContent = 'Admin Email / ID';
                submitBtn.textContent = 'Sign In to Admin Portal →';
                userInput.value = orgParam === 'chanakya' ? 'admin@chanakyakota.in' : 'director@apexpatna.in';
            } else if (tab === 'STUDENT') {
                document.getElementById('tabStudent').classList.add('active');
                idLabel.textContent = 'Student Enrollment Roll No / Email';
                submitBtn.textContent = 'Launch Student CBT Terminal →';
                userInput.value = 'student@apexpatna.in';
            }
        };

        window.handleFormSubmit = function(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value.trim();

            if (username.includes('rannvijay') || username.includes('master') || username === 'admin@platform.com') {
                quickLogin('rannvijay@platform.com');
                return;
            }

            if (activeTab === 'STUDENT') {
                quickLogin('student@apexpatna.in');
                return;
            }

            // 1. Check Custom Provisioned Admin Accounts in localStorage
            try {
                const customAccounts = JSON.parse(localStorage.getItem('cbt_admin_accounts') || '{}');
                if (customAccounts[username]) {
                    const acc = customAccounts[username];
                    if (acc.password && password && acc.password !== password && password !== '••••••••') {
                        alert(`❌ Access Denied: Incorrect password for ${username}. Please enter the official access key provisioned for your institute.`);
                        return;
                    }
                    setAuthSession(acc, true);
                    alert(`🏢 Welcome ${acc.name}!\n\nAccessing strictly isolated database:\n[${acc.dbName}]\nZero cross-institute visibility.`);
                    window.location.href = `/dashboards/institute-admin.html?tenant=${acc.instituteId}`;
                    return;
                }
            } catch (err) {
                console.error(err);
            }

            // 2. Preset Accounts
            if (username.includes('chanakya') || username.includes('kota') || orgParam === 'chanakya') {
                quickLogin('admin@chanakyakota.in');
            } else {
                quickLogin('director@apexpatna.in');
            }
        };

        window.quickLogin = function(accountEmail) {
            const account = PRESET_ACCOUNTS[accountEmail];
            if (!account) return;

            setAuthSession(account, true);

            if (account.role === USER_ROLES.SUPER_ADMIN) {
                alert(`👑 Welcome RannVijay! Platform Master Console Authorized.`);
                window.location.href = '/dashboards/super-admin.html';
            } else if (account.role === USER_ROLES.INSTITUTE_ADMIN) {
                alert(`🏢 Welcome ${account.name}!\n\nAccessing strictly isolated database:\n[${account.dbName}]\nZero visibility into any other institute.`);
                window.location.href = '/dashboards/institute-admin.html';
            } else if (account.role === USER_ROLES.STUDENT) {
                alert(`🎓 Welcome ${account.name}! Launching your exam terminal.`);
                window.location.href = '/index.html';
            }
        };
    </script>
</body>
</html>
